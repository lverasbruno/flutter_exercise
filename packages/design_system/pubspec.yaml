name: design_system
description: "Form&Fun Design System"
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.1.0
  flutter_svg: ^2.0.10

flutter:
  uses-material-design: true

  assets:
    - assets/animation/
    - assets/images/
    - assets/icons/

  fonts:
    - family: AktivGrotesk
      fonts:
        - asset: assets/fonts/AktivGrotesk_Hair.ttf
          weight: 100
        - asset: assets/fonts/AktivGrotesk_Th.ttf
          weight: 200
        - asset: assets/fonts/AktivGrotesk_Lt.ttf
          weight: 300
        - asset: assets/fonts/AktivGrotesk_Rg.ttf
          weight: 400
        - asset: assets/fonts/AktivGrotesk_Md.ttf
          weight: 500
        - asset: assets/fonts/AktivGrotesk_SBd.ttf
          weight: 600
        - asset: assets/fonts/AktivGrotesk_Bd.ttf
          weight: 700
        - asset: assets/fonts/AktivGrotesk_XBd.ttf
          weight: 800
        - asset: assets/fonts/AktivGrotesk_Blk.ttf
          weight: 900

